name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # O site fica em https://<usuario>.github.io/<repo>/, daí o base href com o nome do repo.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # O Pages não conhece as rotas do Angular: o 404.html devolve o app em /lar, /roster etc.
      - run: cp dist/aniimo/browser/index.html dist/aniimo/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/aniimo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
