<div class="moldura" [class.ampliado]="ampliado()">
  <svg #svg class="mapa" [attr.viewBox]="viewBox()" preserveAspectRatio="xMidYMid meet" role="img"
    [attr.aria-label]="'Mapa do Lar no RV ' + planta().rv"
    (wheel)="rodinha($event)" (pointerdown)="apertar($event)" (pointermove)="mover($event)"
    (pointerup)="soltar($event)" (pointercancel)="soltar($event)" (pointerleave)="soltar($event)"
    (click)="selecionado.set(null)">
    <defs>
      <!-- ===== texturas de chão ===== -->
      <pattern id="ml-grama" width="6" height="6" patternUnits="userSpaceOnUse">
        <rect width="6" height="6" fill="#9cc56a" />
        <path d="M.6 1.2l.15-.45.15.45M3.4 .7l.15-.45.15.45M2.1 3.6l.15-.45.15.45M4.8 4.3l.15-.45.15.45M.9 5.2l.15-.45.15.45M5.3 1.9l.15-.45.15.45"
          fill="none" stroke="#7fae55" stroke-width=".09" stroke-linecap="round" />
        <circle cx="2.8" cy="2.2" r=".22" fill="#b1d57f" opacity=".7" />
        <circle cx="4.6" cy="5.4" r=".18" fill="#b1d57f" opacity=".7" />
      </pattern>
      <pattern id="ml-prado" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect width="4" height="4" fill="#94c064" />
        <rect width="4" height="2" fill="#8cb95c" />
        <path d="M1 3.2l.12-.35.12.35M3 1.1l.12-.35.12.35" fill="none" stroke="#78a74f" stroke-width=".08" stroke-linecap="round" />
      </pattern>
      <pattern id="ml-pedras" width="2" height="2" patternUnits="userSpaceOnUse">
        <rect width="2" height="2" fill="#e6d4a9" />
        <g fill="#d8c291" stroke="#c4aa78" stroke-width=".05">
          <rect x=".08" y=".1" width=".85" height=".75" rx=".28" />
          <rect x="1.02" y=".06" width=".9" height=".8" rx=".3" />
          <rect x=".5" y="1.02" width=".95" height=".85" rx=".3" />
          <rect x="-.45" y="1.05" width=".85" height=".8" rx=".28" />
          <rect x="1.55" y="1.05" width=".85" height=".8" rx=".28" />
        </g>
      </pattern>
      <pattern id="ml-piso" width="1" height="1" patternUnits="userSpaceOnUse">
        <rect width="1" height="1" fill="#ddd0b5" />
        <path d="M0 0H1M0 0V1" stroke="#c4b192" stroke-width=".06" />
        <rect x=".12" y=".12" width=".3" height=".3" fill="#e6dbc3" opacity=".6" />
      </pattern>
      <pattern id="ml-cascalho" width="2" height="2" patternUnits="userSpaceOnUse">
        <rect width="2" height="2" fill="#cfc6b2" />
        <g fill="#b5ab97">
          <circle cx=".3" cy=".4" r=".12" /><circle cx="1.2" cy=".2" r=".09" /><circle cx="1.6" cy="1.1" r=".13" />
          <circle cx=".7" cy="1.5" r=".1" /><circle cx="1.1" cy="1.8" r=".08" /><circle cx=".2" cy="1.1" r=".07" />
        </g>
      </pattern>
      <pattern id="ml-palha" width="2" height="2" patternUnits="userSpaceOnUse">
        <rect width="2" height="2" fill="#ecd58f" />
        <path d="M.1 .4l.6-.2M1 .9l.7.15M.3 1.5l.55-.25M1.2 1.7l.6-.3M.9 .2l.4.3" stroke="#d6b865" stroke-width=".07" stroke-linecap="round" />
      </pattern>
      <pattern id="ml-grade" width="1" height="1" patternUnits="userSpaceOnUse">
        <path d="M1 0H0V1" fill="none" stroke="#1d2a1a" stroke-width=".03" opacity=".45" />
      </pattern>
      <radialGradient id="ml-brilho">
        <stop offset="0" stop-color="#fff3c4" stop-opacity=".9" />
        <stop offset="1" stop-color="#ffd98a" stop-opacity="0" />
      </radialGradient>

      <!-- ===== peças reaproveitadas (viewBox próprio) ===== -->
      <symbol id="ml-broto" viewBox="0 0 2 2">
        <ellipse cx=".62" cy="1.15" rx=".55" ry=".28" transform="rotate(-35 .62 1.15)" fill="currentColor" />
        <ellipse cx="1.38" cy="1.15" rx=".55" ry=".28" transform="rotate(35 1.38 1.15)" fill="currentColor" />
        <circle cx="1" cy=".72" r=".38" style="fill: var(--cor-2)" stroke="#00000022" stroke-width=".06" />
      </symbol>
      <symbol id="ml-copa" viewBox="0 0 4 4">
        <ellipse cx="2.25" cy="2.55" rx="1.6" ry="1.2" fill="#00000026" />
        <circle cx="1.45" cy="1.9" r="1.05" fill="currentColor" />
        <circle cx="2.55" cy="1.75" r="1.1" fill="currentColor" />
        <circle cx="2" cy="1.25" r="1" fill="currentColor" />
        <circle cx="1.7" cy="1.05" r=".45" fill="#ffffff" opacity=".18" />
        <circle cx="1.3" cy="2" r=".2" style="fill: var(--cor-2)" />
        <circle cx="2.7" cy="1.5" r=".2" style="fill: var(--cor-2)" />
        <circle cx="2.2" cy="2.3" r=".2" style="fill: var(--cor-2)" />
      </symbol>

      <!-- ===== cultivo ===== -->
      <symbol id="ml-fazenda" viewBox="0 0 10 10">
        <rect x=".35" y=".35" width="9.3" height="9.3" rx="1.1" fill="#8b5a36" />
        <rect x=".9" y=".9" width="8.2" height="8.2" rx=".8" fill="#9a6640" />
        <g fill="#7a4c2d">
          <rect x="1.2" y="3.3" width="7.6" height=".8" rx=".4" />
          <rect x="1.2" y="7.7" width="7.6" height=".8" rx=".4" />
        </g>
        @for (y of [0.7, 5.1]; track y) {
          @for (x of [0.7, 5.1]; track x) {
            <use href="#ml-broto" [attr.x]="x" [attr.y]="y" width="4.2" height="4.2" />
          }
        }
      </symbol>
      <symbol id="ml-fazenda-coringa" viewBox="0 0 10 10">
        <rect x=".35" y=".35" width="9.3" height="9.3" rx="1.1" fill="#8b5a36" />
        <rect x=".9" y=".9" width="8.2" height="8.2" rx=".8" fill="#9a6640" />
        <rect x=".9" y=".9" width="8.2" height="8.2" rx=".8" fill="none" stroke="currentColor" stroke-width=".35" stroke-dasharray=".8 .5" />
        <circle cx="5" cy="5" r="2.9" style="fill: var(--cor-2)" opacity=".9" />
        <path d="M5 2.6l.72 1.62 1.76.18-1.32 1.18.38 1.73L5 6.42l-1.54.89.38-1.73-1.32-1.18 1.76-.18z"

      <symbol id="ml-bosque" viewBox="0 0 10 10">
        <rect x=".3" y=".3" width="9.4" height="9.4" rx="1.4" fill="#86b35a" />
        <rect x=".3" y=".3" width="9.4" height="9.4" rx="1.4" fill="none" stroke="#6f9a49" stroke-width=".25" stroke-dasharray=".6 .5" />
        <use href="#ml-copa" x=".5" y=".4" width="4.6" height="4.6" />
        <use href="#ml-copa" x="5" y=".6" width="4.4" height="4.4" />
        <use href="#ml-copa" x=".7" y="5" width="4.4" height="4.4" />
        <use href="#ml-copa" x="5.1" y="5.1" width="4.5" height="4.5" />
      </symbol>
      <symbol id="ml-chocadeira" viewBox="0 0 10 10">
        <ellipse cx="5.3" cy="5.6" rx="4.4" ry="4" fill="#00000022" />
        <circle cx="5" cy="5" r="4.3" fill="#d9b457" />
        <circle cx="5" cy="5" r="4.3" fill="none" stroke="#b8923d" stroke-width=".35" stroke-dasharray=".5 .35" />
        <circle cx="5" cy="5" r="3" fill="#c49a45" />
        <g stroke="#a88338" stroke-width=".12">
          <ellipse cx="3.9" cy="5.3" rx="1.05" ry="1.35" fill="#fff8ea" transform="rotate(-18 3.9 5.3)" />
          <ellipse cx="6.1" cy="5.4" rx="1.05" ry="1.35" fill="#f4f0ff" transform="rotate(16 6.1 5.4)" />
          <ellipse cx="5" cy="3.9" rx="1" ry="1.3" fill="#eafaf2" />
        </g>
        <circle cx="3.6" cy="5" r=".22" fill="#f2a3c0" /><circle cx="6.3" cy="5.8" r=".2" fill="#8fb3f0" />
        <circle cx="5.2" cy="3.5" r=".2" fill="#8fd1a8" /><circle cx="4.7" cy="4.2" r=".14" fill="#8fd1a8" />
      </symbol>

      <!-- ===== ambientes ===== -->
      <symbol id="ml-fornalha" viewBox="0 0 10 10">
        <circle cx="5.4" cy="5.6" r="4.4" fill="#00000030" />
        <circle cx="5" cy="5" r="4.5" fill="#8d8478" />
        <circle cx="5" cy="5" r="3.3" fill="#3f3530" />
        <path d="M5 1.8c.9 1.9 2.9 2.9 2.9 5a2.9 2.9 0 0 1-5.8 0c0-1.2.6-2 1.3-2.6.2 1 .7 1.5 1.3 1.7-.4-1.6-.2-3 .3-4.1z" fill="currentColor" />
        <path d="M5 4.6c.5.9 1.3 1.4 1.3 2.4a1.3 1.3 0 0 1-2.6 0c0-.8.6-1.4 1.3-2.4z" fill="#ffe08a" />
      </symbol>
      <symbol id="ml-resfriador" viewBox="0 0 10 10">
        <rect x=".9" y="1.1" width="8.6" height="8.6" rx="1.2" fill="#00000026" />
        <rect x=".5" y=".5" width="8.6" height="8.6" rx="1.2" fill="#d7e8ee" stroke="#86a9b6" stroke-width=".3" />
        <g stroke="#a9c3cc" stroke-width=".25"><path d="M1.5 2.2h6.6M1.5 7.4h6.6" /></g>
        <g stroke="currentColor" stroke-width=".55" stroke-linecap="round" fill="none">

        </g>
      </symbol>
      <symbol id="ml-lampada" viewBox="0 0 10 10">
        <circle cx="5" cy="5" r="4.8" fill="currentColor" opacity=".35" />
        <circle cx="5" cy="5" r="3" fill="#fff6c9" opacity=".8" />
        <circle cx="5" cy="5" r="1.9" fill="#5b5048" />
        <circle cx="5" cy="5" r="1.2" fill="#fff3b0" />
      </symbol>

      <!-- ===== recursos ===== -->
      <symbol id="ml-mina" viewBox="0 0 10 10">
        <path d="M.6 8.6 1.4 3.4 3.8 1.2l3.3.4 2.3 2.6-.3 4.8z" fill="#00000026" transform="translate(.35 .4)" />
        <path d="M.6 8.6 1.4 3.4 3.8 1.2l3.3.4 2.3 2.6-.3 4.8z" fill="#a49b8d" />
        <path d="M1.4 3.4 3.8 1.2l3.3.4-1.6 2.2-2.9.4z" fill="#bdb4a6" />
        <path d="M6.9 1.6l2.5 2.6-1.8.8-2.1-1.2z" fill="#8f877a" />
        <path d="M3.3 8.9V6.5a1.7 1.7 0 0 1 3.4 0v2.4z" fill="#2f2a26" stroke="#8a5a34" stroke-width=".45" />
        <path d="M4.3 8.9v.9M5.7 8.9v.9M4 9.4h2" stroke="#6e4527" stroke-width=".22" />
        <circle cx="2.4" cy="6" r=".35" fill="#d9b86a" /><circle cx="7.6" cy="5.4" r=".3" fill="#9fd2d9" />
      </symbol>
      <symbol id="ml-poco" viewBox="0 0 10 10">
        <circle cx="5.3" cy="5.4" r="4.2" fill="#00000026" />
        <circle cx="5" cy="5" r="4.1" fill="#a59c8e" stroke="#7c7367" stroke-width=".5" stroke-dasharray="1.4 .25" />
        <circle cx="5" cy="5" r="2.6" fill="#4f9fd8" />
        <path d="M3.8 4.3q1.2-.6 2.4 0" stroke="#bfe3fa" stroke-width=".3" fill="none" stroke-linecap="round" />
        <rect x=".6" y="4.5" width="8.8" height="1" rx=".3" fill="#8a5a34" />
        <rect x="4.3" y="5.6" width="1.4" height="1.3" rx=".2" fill="#6e4527" />
      </symbol>

      <!-- ===== oficina (máquinas) ===== -->
      <symbol id="ml-oficina" viewBox="0 0 10 10">
        <rect x="1.2" y="1.4" width="8.4" height="8.3" rx=".7" fill="#00000030" />
        <rect x=".7" y=".8" width="8.6" height="8.4" rx=".7" fill="#f1e4c8" stroke="#b79b72" stroke-width=".25" />
        <path d="M.7 1.5a.7.7 0 0 1 .7-.7h7.2a.7.7 0 0 1 .7.7v4.1H.7z" fill="currentColor" />
        <path d="M.7 5.6h8.6" stroke="#00000033" stroke-width=".35" />
        <path d="M1.2 3.2h7.6" stroke="#ffffff40" stroke-width=".25" />
        <rect x="6.6" y="1.4" width="1.3" height="1.3" rx=".2" fill="#6b5e52" />
        <rect x="3.7" y="6.6" width="2.6" height="2.6" rx=".3" fill="#9c7a52" />
        <circle cx="5" cy="7.6" r=".55" style="fill: var(--cor-2)" />
      </symbol>
      <symbol id="ml-moinho" viewBox="0 0 10 10">
        <circle cx="5.3" cy="5.4" r="3.4" fill="#00000030" />
        <circle cx="5" cy="5" r="3.2" fill="#f1e4c8" stroke="#b79b72" stroke-width=".3" />
        <g fill="currentColor" stroke="#ffffff66" stroke-width=".15" transform="rotate(20 5 5)">
          <path d="M5 5 4.2 .5h1.6z" /><path d="M5 5l4.5-.8v1.6z" /><path d="M5 5l.8 4.5H4.2z" /><path d="M5 5 .5 5.8V4.2z" />
        </g>
        <circle cx="5" cy="5" r=".8" fill="#6b5e52" />
      </symbol>

      <!-- ===== depósito ===== -->
      <symbol id="ml-armazem" viewBox="0 0 10 10">
        <rect x="1" y="1.2" width="8.6" height="8.4" rx=".6" fill="#00000030" />
        <rect x=".6" y=".6" width="8.6" height="8.4" rx=".6" fill="#b9855a" stroke="#7e5634" stroke-width=".3" />
        <path d="M.6 1.2a.6.6 0 0 1 .6-.6h7.4a.6.6 0 0 1 .6.6v3.6H.6z" fill="currentColor" />
        <path d="M2.4.6v4.2M4.2.6v4.2M6 .6v4.2M7.8.6v4.2" stroke="#00000026" stroke-width=".25" />
        <path d="M.6 4.8h8.6" stroke="#00000040" stroke-width=".35" />
        <g stroke="#7e5634" stroke-width=".22">
          <rect x="1.3" y="5.6" width="2.6" height="2.6" rx=".2" fill="#d9a86a" />
          <path d="M1.3 5.6l2.6 2.6M3.9 5.6 1.3 8.2" />
          <rect x="5.9" y="5.9" width="2.4" height="2.4" rx=".2" fill="#c99758" />
        </g>
        <circle cx="5" cy="6.9" r=".5" style="fill: var(--cor-2)" />
      </symbol>

      <!-- ===== moradias de Aniimo ===== -->
      <symbol id="ml-casa-orvalho" viewBox="0 0 10 10">
        <circle cx="5.3" cy="5.4" r="4.3" fill="#00000026" />
        <circle cx="5" cy="5" r="4.3" fill="#bfe6df" stroke="#7fbcb1" stroke-width=".3" />
        <path d="M5 2c1 1.5 1.8 2.4 1.8 3.5a1.8 1.8 0 0 1-3.6 0C3.2 4.4 4 3.5 5 2z" fill="#6fb8d9" />
        <circle cx="2.6" cy="6.7" r=".45" fill="#8fd0e8" /><circle cx="7.4" cy="6.9" r=".35" fill="#8fd0e8" />
      </symbol>
      <symbol id="ml-cama-nuvem" viewBox="0 0 10 10">
        <path d="M2.4 8.6a2 2 0 0 1-.2-4 2.6 2.6 0 0 1 5-1 2.2 2.2 0 0 1 .6 5z" fill="#00000022" transform="translate(.3 .35)" />
        <path d="M2.4 8.6a2 2 0 0 1-.2-4 2.6 2.6 0 0 1 5-1 2.2 2.2 0 0 1 .6 5z" fill="#fbfbff" stroke="#b9c3dd" stroke-width=".25" />
        <path d="M3.4 6.4h3.4" stroke="#e77894" stroke-width=".5" stroke-linecap="round" />
      </symbol>
      <symbol id="ml-castelo-areia" viewBox="0 0 10 10">
        <rect x="1.4" y="1.6" width="7.8" height="7.8" rx=".5" fill="#00000026" />
        <rect x="1" y="1.2" width="7.8" height="7.8" rx=".5" fill="#ecd59d" stroke="#c9ad6a" stroke-width=".25" />
        <g fill="#dcc07e" stroke="#c9ad6a" stroke-width=".2">
          <rect x=".4" y=".6" width="2.4" height="2.4" rx=".3" /><rect x="7" y=".6" width="2.4" height="2.4" rx=".3" />
          <rect x=".4" y="7" width="2.4" height="2.4" rx=".3" /><rect x="7" y="7" width="2.4" height="2.4" rx=".3" />
        </g>
        <path d="M4.9 3.2v3M4.9 3.2l1.6.6-1.6.6" stroke="#e77894" stroke-width=".3" fill="#e77894" />
        <circle cx="5" cy="7.2" r=".6" fill="#f7e9f0" />
      </symbol>
      <symbol id="ml-rede-estelar" viewBox="0 0 10 10">
        <rect x="1" y="2.2" width="1" height="5.6" rx=".3" fill="#8a5a34" />
        <rect x="8" y="2.2" width="1" height="5.6" rx=".3" fill="#8a5a34" />
        <path d="M2 3.4q3 5.4 6 0v3.2q-3 3-6 0z" fill="#e7a0c0" stroke="#c97aa0" stroke-width=".2" />
        <path d="M5 .6l.35.8.85.1-.65.55.2.85L5 2.45l-.75.45.2-.85-.65-.55.85-.1z" fill="#f6d04d" />
        <circle cx="7.8" cy="8.8" r=".3" fill="#f6d04d" /><circle cx="2.4" cy="9" r=".22" fill="#f6d04d" />
      </symbol>
      <symbol id="ml-moinho-floral" viewBox="0 0 10 10">
        <circle cx="5.3" cy="5.4" r="2.6" fill="#00000026" />
        <g fill="#f2a3c0" stroke="#d97a9f" stroke-width=".15">
          <ellipse cx="5" cy="2.6" rx="1.2" ry="2.1" /><ellipse cx="5" cy="7.4" rx="1.2" ry="2.1" />
          <ellipse cx="2.6" cy="5" rx="2.1" ry="1.2" /><ellipse cx="7.4" cy="5" rx="2.1" ry="1.2" />
        </g>
        <circle cx="5" cy="5" r="1.5" fill="#f6d04d" stroke="#d9ae2e" stroke-width=".2" />
      </symbol>




      <!-- ===== vinhetas: cultivo ===== -->
      <symbol id="ml-espantalho" viewBox="0 0 10 10">
        <ellipse cx="5.3" cy="6.2" rx="3.2" ry="1.6" fill="#00000026" />
        <path d="M1.2 5h7.6" stroke="#8a5a34" stroke-width=".7" stroke-linecap="round" />
        <path d="M2.4 4.2 1 5.8M7.6 4.2 9 5.8" stroke="#e8c96b" stroke-width=".35" stroke-linecap="round" />
        <rect x="3.6" y="4" width="2.8" height="3.6" rx=".6" fill="#c9503f" />
        <path d="M3.6 5.1h2.8M5 4v3.6" stroke="#9a3a2f" stroke-width=".2" />
        <circle cx="5" cy="3" r="1.6" fill="#b88a3a" />

      <symbol id="ml-feno" viewBox="0 0 10 10">

        <rect x="1" y="1.8" width="7.8" height="6" rx="1.4" fill="#e3c15e" stroke="#b8923d" stroke-width=".3" />
        <path d="M1.4 3.4h7M1.4 5.2h7M1.4 6.8h7" stroke="#c9a24e" stroke-width=".25" />
        <path d="M3.6 1.8v6M6.2 1.8v6" stroke="#8a5a34" stroke-width=".4" />
      </symbol>
      <symbol id="ml-bebedouro" viewBox="0 0 20 10">

        <rect x="1.2" y="2" width="17.4" height="5.8" rx="1" fill="#8a5a34" stroke="#6e4527" stroke-width=".3" />
        <rect x="2.2" y="3" width="15.4" height="3.8" rx=".6" fill="#5fa7d8" />
        <path d="M4 4.4q1.5-.6 3 0M10 5.2q1.5-.6 3 0" stroke="#bfe3fa" stroke-width=".3" fill="none" stroke-linecap="round" />
      </symbol>
      <symbol id="ml-carrinho-mao" viewBox="0 0 10 10">
        <ellipse cx="5.4" cy="6.4" rx="3.4" ry="2" fill="#00000026" />
        <path d="M2.4 3.4h5.8l-1 3.8H3.4z" fill="#9a6a40" stroke="#6e4527" stroke-width=".25" />
        <path d="M3.2 4.2h4.2l-.6 2.2H3.8z" fill="#b8923d" />
        <circle cx="5.3" cy="7.8" r=".9" fill="#3f3833" />
        <path d="M2.4 3.4 1 2.2M8.2 3.4 9.4 2.2" stroke="#6e4527" stroke-width=".35" stroke-linecap="round" />
      </symbol>

      <!-- ===== vinhetas: oficina ===== -->
      <symbol id="ml-caixote" viewBox="0 0 10 10">
        <rect x="1.8" y="2.2" width="7" height="7" rx=".4" fill="#00000026" />
        <rect x="1.4" y="1.6" width="7" height="7" rx=".4" fill="currentColor" stroke="#6e4527" stroke-width=".35" />
        <path d="M1.8 2 8 8.2M8 2 1.8 8.2" stroke="#6e4527" stroke-width=".3" />
        <rect x="1.4" y="1.6" width="7" height="7" rx=".4" fill="none" stroke="#ffffff30" stroke-width=".5" />
      </symbol>
      <symbol id="ml-barril" viewBox="0 0 10 10">
        <circle cx="5.3" cy="5.5" r="3.6" fill="#00000026" />
        <circle cx="5" cy="5" r="3.6" fill="currentColor" stroke="#5e3c22" stroke-width=".35" />
        <circle cx="5" cy="5" r="2.6" fill="none" stroke="#6b6560" stroke-width=".35" />
        <circle cx="5" cy="5" r="1.2" fill="#00000022" />
      </symbol>
      <symbol id="ml-sacos" viewBox="0 0 10 10">
        <ellipse cx="5.4" cy="6.6" rx="3.8" ry="2" fill="#00000026" />
        <ellipse cx="3.6" cy="5.4" rx="2.3" ry="2.6" fill="#e6d3a8" stroke="#b79d6c" stroke-width=".25" />
        <ellipse cx="6.6" cy="5.8" rx="2.2" ry="2.4" fill="#dbc696" stroke="#b79d6c" stroke-width=".25" />
        <path d="M3 3.2l1.2.2M6 3.8l1.2.2" stroke="#8a5a34" stroke-width=".3" stroke-linecap="round" />
      </symbol>
      <symbol id="ml-vaso" viewBox="0 0 10 10">
        <circle cx="5.3" cy="5.6" r="3.2" fill="#00000026" />
        <circle cx="5" cy="5" r="3" fill="#c46a3f" stroke="#8f4a2b" stroke-width=".3" />
        <circle cx="4" cy="4.4" r="1.4" fill="#5f9a4a" />
        <circle cx="5.8" cy="4.2" r="1.3" fill="#6aa652" />
        <circle cx="5" cy="5.6" r="1.4" fill="#4f8a42" />
        <circle cx="5" cy="4.6" r=".45" fill="currentColor" />
      </symbol>
      <symbol id="ml-lanterna" viewBox="0 0 10 10">
        <circle cx="5" cy="5" r="4.8" fill="url(#ml-brilho)" />
        <rect x="3.6" y="3.6" width="2.8" height="2.8" rx=".5" fill="#3f3833" />
        <rect x="4.1" y="4.1" width="1.8" height="1.8" rx=".3" fill="#ffd98a" />
      </symbol>

      <!-- ===== vinhetas: minas e moradias ===== -->
      <symbol id="ml-carrinho-minerio" viewBox="0 0 20 10">
        <path d="M0 3.4h20M0 6.6h20" stroke="#6b6560" stroke-width=".4" />
        <g stroke="#8a5a34" stroke-width=".6"><path d="M2 2.8v4.4M6 2.8v4.4M10 2.8v4.4M14 2.8v4.4M18 2.8v4.4" /></g>
        <rect x="6.4" y="1.8" width="7.4" height="6.4" rx=".8" fill="#5b5b62" stroke="#3a3a40" stroke-width=".3" />
        <circle cx="8.6" cy="4.2" r="1.1" fill="#9c968a" /><circle cx="10.6" cy="4.8" r="1" fill="#c9b27a" />
        <circle cx="11.8" cy="3.8" r=".8" fill="#9fd2d9" />
      </symbol>
      <symbol id="ml-pedras-minerio" viewBox="0 0 10 10">
        <ellipse cx="5.4" cy="6.6" rx="3.8" ry="2.2" fill="#00000026" />
        <path d="M1.6 7 2.6 4l2.4-1.2L7.6 4l.8 3z" fill="#9c968a" />
        <path d="M3.6 5.6l1.6-1.6 1.6 1.2-.4 1.6z" fill="#b8b1a4" />
        <circle cx="3.4" cy="6.2" r=".45" fill="#c9b27a" /><circle cx="6.8" cy="5.2" r=".4" fill="#9fd2d9" />
      </symbol>
      <symbol id="ml-arco-florido" viewBox="0 0 20 10">
        <ellipse cx="10.4" cy="6.2" rx="8.6" ry="2.6" fill="#00000022" />
        <rect x="2" y="2.4" width="1.2" height="5.2" rx=".4" fill="#f4efe6" />
        <rect x="16.8" y="2.4" width="1.2" height="5.2" rx=".4" fill="#f4efe6" />
        <path d="M2.6 3.2Q10 -1.2 17.4 3.2" stroke="#f4efe6" stroke-width=".9" fill="none" />
        @for (f of [[3.2, 3], [5.6, 1.9], [8.2, 1.3], [10.8, 1.3], [13.4, 1.9], [15.8, 3]]; track $index) {
          <circle [attr.cx]="f[0]" [attr.cy]="f[1]" r=".9" fill="currentColor" />
          <circle [attr.cx]="f[0]" [attr.cy]="f[1]" r=".32" fill="#f6c343" />
        }
        <g fill="#5f9a4a"><ellipse cx="4.4" cy="2.2" rx=".9" ry=".4" /><ellipse cx="12.2" cy="1" rx=".9" ry=".4" /></g>
      </symbol>
      <symbol id="ml-casinha-passaro" viewBox="0 0 10 10">
        <circle cx="5.3" cy="5.6" r="2.6" fill="#00000022" />
        <path d="M1.8 4.6 5 1.6l3.2 3z" fill="currentColor" />
        <rect x="2.6" y="4.4" width="4.8" height="3.8" rx=".3" fill="#f1e4c8" stroke="#b79b72" stroke-width=".25" />
        <circle cx="5" cy="6" r=".8" fill="#3f3833" />
      </symbol>

      <!-- ===== praças ===== -->
      <symbol id="ml-fonte" viewBox="0 0 10 10">
        <circle cx="5.2" cy="5.4" r="4.7" fill="#00000026" />
        <circle cx="5" cy="5" r="4.6" fill="#c9c0ae" stroke="#9c968a" stroke-width=".35" />
        <circle cx="5" cy="5" r="3.7" fill="#5fa7d8" />
        <circle cx="5" cy="5" r="1.5" fill="#c9c0ae" stroke="#9c968a" stroke-width=".25" />
        <circle cx="5" cy="5" r=".7" fill="#bfe3fa" />
        <g fill="none" stroke="#bfe3fa" stroke-width=".25" stroke-linecap="round">
          <path d="M2.3 4.2q.6-.5 1.2 0M6.6 6.6q.6-.5 1.2 0M6.4 2.9q.5-.4 1 0" />
        </g>
      </symbol>
      <symbol id="ml-lago" viewBox="0 0 40 30">
        <path d="M5 13C4 6 13 2 21 3.5S37 6 36.5 14 33 27 22 27.5 6 22 5 13z" fill="#00000022" transform="translate(.6 .8)" />
        <path d="M5 13C4 6 13 2 21 3.5S37 6 36.5 14 33 27 22 27.5 6 22 5 13z" fill="#4f9fd8" stroke="#8fbf6a" stroke-width="1.2" />
        <path d="M9 12q3-2 6 0M22 20q3-2 6 0M24 9q2.5-1.6 5 0" stroke="#bfe3fa" stroke-width=".6" fill="none" stroke-linecap="round" />
        <g fill="#5f9a4a"><circle cx="13" cy="19" r="1.6" /><circle cx="28" cy="13" r="1.4" /><circle cx="19" cy="9" r="1.2" /></g>
        <circle cx="13.4" cy="18.6" r=".5" fill="#f2a3c0" /><circle cx="28.3" cy="12.7" r=".45" fill="#fdfbf5" />
        <g fill="#9a6a40" stroke="#6e4527" stroke-width=".25">
          <rect x="16" y="23.2" width="9" height="3.2" rx=".4" />
        </g>
        <path d="M17.5 23.2v3.2M19.5 23.2v3.2M21.5 23.2v3.2M23.5 23.2v3.2" stroke="#6e4527" stroke-width=".25" />
      </symbol>
      <symbol id="ml-piquenique" viewBox="0 0 10 10">
        <rect x="1.4" y="1.6" width="7.8" height="7.8" rx=".6" fill="#00000022" />
        <rect x="1.4" y="1" width="7.2" height="1.3" rx=".4" fill="#8a5a34" />
        <rect x="1.4" y="7.7" width="7.2" height="1.3" rx=".4" fill="#8a5a34" />
        <rect x="1.8" y="3" width="6.4" height="4" rx=".4" fill="#f4efe6" />
        <g fill="#e05a5a" opacity=".85">
          <rect x="1.8" y="3" width="1.6" height="1.3" /><rect x="5" y="3" width="1.6" height="1.3" />
          <rect x="3.4" y="4.3" width="1.6" height="1.4" /><rect x="6.6" y="4.3" width="1.6" height="1.4" />
          <rect x="1.8" y="5.7" width="1.6" height="1.3" /><rect x="5" y="5.7" width="1.6" height="1.3" />
        </g>
        <circle cx="4.2" cy="5" r=".6" fill="#f6c343" /><circle cx="6" cy="5.4" r=".5" fill="#c9503f" />
      </symbol>
      <symbol id="ml-estatua" viewBox="0 0 10 10">
        <rect x="1.6" y="1.8" width="7.2" height="7.2" rx=".5" fill="#00000026" />
        <rect x="1.2" y="1.2" width="7.2" height="7.2" rx=".5" fill="#c9c0ae" stroke="#9c968a" stroke-width=".3" />
        <circle cx="4.8" cy="4" r="1.3" fill="#e8e2d6" />
        <path d="M3 7.2q1.8-2.8 3.6 0z" fill="#e8e2d6" />
        <path d="M6.2 3.2l1.4-1" stroke="#e8e2d6" stroke-width=".5" stroke-linecap="round" />
      </symbol>

      <!-- ===== decoração ===== -->
      <symbol id="ml-arvore" viewBox="0 0 10 10">
        <ellipse cx="5.6" cy="6.4" rx="4.1" ry="3.3" fill="#00000030" />
        <circle cx="3.6" cy="5.4" r="2.8" fill="currentColor" />
        <circle cx="6.5" cy="5" r="2.9" fill="currentColor" />
        <circle cx="5" cy="3.4" r="2.8" fill="currentColor" />
        <circle cx="5" cy="3.4" r="2.8" fill="#ffffff" opacity=".1" />
        <circle cx="4.2" cy="2.6" r="1.1" fill="#ffffff" opacity=".16" />
      </symbol>
      <symbol id="ml-arbusto" viewBox="0 0 10 10">
        <ellipse cx="5.4" cy="6.4" rx="4" ry="2.8" fill="#00000026" />
        <circle cx="3.6" cy="5.6" r="2.6" fill="currentColor" />
        <circle cx="6.4" cy="5.4" r="2.7" fill="currentColor" />
        <circle cx="5" cy="3.8" r="2.6" fill="currentColor" />
        <circle cx="4.3" cy="3.2" r="1" fill="#ffffff" opacity=".17" />
      </symbol>
      <symbol id="ml-flores" viewBox="0 0 10 10">
        <g fill="#5f9a4a"><ellipse cx="3" cy="4" rx="1.4" ry=".6" /><ellipse cx="7" cy="7" rx="1.4" ry=".6" /><ellipse cx="6" cy="3" rx="1.2" ry=".5" /></g>
        @for (f of [[2.6, 3.2], [6.4, 2.4], [4.6, 6], [7.4, 6.4], [2.4, 7.4]]; track $index) {
          <g [attr.transform]="'translate(' + f[0] + ' ' + f[1] + ')'">
            <circle r="1.05" fill="currentColor" stroke="#00000018" stroke-width=".15" />
            <circle r=".42" fill="#f6c343" />
          </g>
        }
      </symbol>
      <symbol id="ml-canteiro" viewBox="0 0 20 10">
        <rect x="1" y="1.6" width="18.6" height="7.8" rx="1" fill="#00000026" />
        <rect x=".6" y="1" width="18.6" height="7.8" rx="1" fill="#8a5a34" />
        <rect x="1.6" y="2" width="16.6" height="5.8" rx=".6" fill="#6f4a2e" />
        @for (x of [3.4, 7, 10.6, 14.2, 17]; track x) {
          <circle [attr.cx]="x - 1" cy="4" r="1.1" fill="currentColor" />
          <circle [attr.cx]="x" cy="6" r="1.1" fill="currentColor" />
          <circle [attr.cx]="x - 1" cy="4" r=".4" fill="#f6c343" />
        }
      </symbol>
      <symbol id="ml-pedra" viewBox="0 0 10 10">
        <ellipse cx="5.4" cy="6.4" rx="3.6" ry="2.4" fill="#00000026" />
        <path d="M2 6.2 3 3.4l3-.9 2.4 1.9-.4 2.6-3 .9z" fill="currentColor" />
        <path d="M3 3.4l3-.9 1.2 1-2.6.8z" fill="#ffffff" opacity=".25" />
      </symbol>
      <symbol id="ml-poste" viewBox="0 0 10 10">
        <circle cx="5" cy="5" r="5" fill="url(#ml-brilho)" />
        <circle cx="5" cy="5" r="1.7" fill="#3f3833" />
        <circle cx="5" cy="5" r="1.05" fill="currentColor" />
      </symbol>
      <symbol id="ml-banco" viewBox="0 0 20 10">
        <rect x="1.8" y="3.6" width="17" height="4.4" rx=".6" fill="#00000026" />
        <g fill="currentColor" stroke="#5e3c22" stroke-width=".2">
          <rect x="1.2" y="2.8" width="17" height="1.3" rx=".4" />
          <rect x="1.2" y="4.5" width="17" height="1.3" rx=".4" />
          <rect x="1.2" y="6.2" width="17" height="1.3" rx=".4" />
        </g>
      </symbol>
    </defs>

    @let p = planta();
    @let c = camadas();
    @let k = caixa();

    <!-- grama além da planta, para os cantos do mapa girado não ficarem vazios -->
    <rect [attr.x]="k.x - 1" [attr.y]="k.y - 1" [attr.width]="k.l + 2" [attr.height]="k.a + 2" fill="url(#ml-grama)" />

    <g [attr.transform]="transformacao()">
    <!-- chão -->
    <rect [attr.width]="p.largura" [attr.height]="p.altura" fill="url(#ml-grama)" />
    @for (b of c.chao; track $index) {
      <rect [attr.x]="b.area.x" [attr.y]="b.area.y" [attr.width]="b.area.largura" [attr.height]="b.area.altura"
        rx=".6" [attr.fill]="'url(#ml-' + b.chao + ')'" />
    }

    <!-- caminhos: primeiro a borda (união dos retângulos expandidos), depois as pedras -->
    <g fill="#b89c6a">
      @for (k of c.caminhos; track $index) {
        <rect [attr.x]="k.area.x - 0.18" [attr.y]="k.area.y - 0.18" [attr.width]="k.area.largura + 0.36" [attr.height]="k.area.altura + 0.36" rx=".5" />
      }
    </g>
    <g fill="url(#ml-pedras)">
      @for (k of c.caminhos; track $index) {
        <rect [attr.x]="k.area.x" [attr.y]="k.area.y" [attr.width]="k.area.largura" [attr.height]="k.area.altura" rx=".35" />
      }
    </g>

    <!-- pátios de lajotas das construções -->
    @for (t of c.pisos; track $index) {
      <rect [attr.x]="t.area.x - 0.12" [attr.y]="t.area.y - 0.12" [attr.width]="t.area.largura + 0.24" [attr.height]="t.area.altura + 0.24"
        rx=".7" fill="#b89c6a" opacity=".55" />
      <rect [attr.x]="t.area.x" [attr.y]="t.area.y" [attr.width]="t.area.largura" [attr.height]="t.area.altura" rx=".6" fill="url(#ml-piso)" />
    }

    <!-- trilhas dentro da área de cultivo -->
    <g fill="#a98c5e">
      @for (t of c.trilhas; track $index) {
        <rect [attr.x]="t.area.x" [attr.y]="t.area.y" [attr.width]="t.area.largura" [attr.height]="t.area.altura" />
      }
    </g>
    <g fill="url(#ml-pedras)">
      @for (t of c.trilhas; track $index) {
        <rect [attr.x]="t.area.x + 0.1" [attr.y]="t.area.y + 0.1" [attr.width]="t.area.largura - 0.2" [attr.height]="t.area.altura - 0.2" rx=".2" />
      }
    </g>

    <!-- auras dos ambientes -->
    @for (a of c.coberturas; track $index) {
      <rect class="aura" [class.tecnica]="grade()" [attr.x]="a.area.x" [attr.y]="a.area.y" [attr.width]="a.area.largura"
        [attr.height]="a.area.altura" [attr.rx]="grade() ? 0 : 1.4" [attr.fill]="cores[a.modo]" [attr.stroke]="cores[a.modo]" />
    }

    <!-- decoração -->
    @for (d of c.decoracao; track $index) {
      <use [attr.href]="'#ml-' + d.forma" [attr.x]="d.area.x" [attr.y]="d.area.y" [attr.width]="d.area.largura"
        [attr.height]="d.area.altura" [style.color]="d.cor" />
    }

    <!-- construções -->
    @for (d of c.construcoes; track $index) {
      <g class="construcao" [class.selecionada]="selecionado() === d.item" [class.estimada]="d.item.estimado"
        [class.reservada]="reservado(d.item)"
        (click)="selecionar(d.item, $event)">
        <title>{{ rotulo(d.item) }}</title>
        <use [attr.href]="'#ml-' + d.simbolo" [attr.x]="d.area.x" [attr.y]="d.area.y" [attr.width]="d.area.largura"
          [attr.height]="d.area.altura" [style.color]="d.cor" [style.--cor-2]="d.cor2" />
        @if (d.item.estimado) {
          <rect class="contorno-estimado" [attr.x]="d.area.x + 0.08" [attr.y]="d.area.y + 0.08" [attr.width]="d.area.largura - 0.16"
            [attr.height]="d.area.altura - 0.16" rx=".3" />
        }
        @if (d.item.eficiencia) {
          <rect class="contorno-fora" [attr.x]="d.area.x + 0.1" [attr.y]="d.area.y + 0.1" [attr.width]="d.area.largura - 0.2"
            [attr.height]="d.area.altura - 0.2" rx=".3" />
        }
        @if (reservado(d.item)) {
          <rect class="contorno-reservado" [attr.x]="d.area.x + 0.12" [attr.y]="d.area.y + 0.12" [attr.width]="d.area.largura - 0.24"
            [attr.height]="d.area.altura - 0.24" rx=".3" />
        }
        <rect class="alvo" [attr.x]="d.area.x" [attr.y]="d.area.y" [attr.width]="d.area.largura" [attr.height]="d.area.altura" rx=".3" />
      </g>
    }

    <!-- cercas (por cima dos lotes da borda) -->
    @for (f of c.cercas; track $index) {
      <g class="cerca">
        <path [attr.d]="f.trilhos" />
        @for (q of f.postes; track $index) {
          <rect [attr.x]="q.x - 0.13" [attr.y]="q.y - 0.13" width=".26" height=".26" rx=".05" />
        }
        @for (q of f.pilares; track $index) {
          <rect class="pilar" [attr.x]="q.x - 0.22" [attr.y]="q.y - 0.22" width=".44" height=".44" rx=".1" />
        }
      </g>
    }

    @if (grade()) {
      <rect class="grade" [attr.width]="p.largura" [attr.height]="p.altura" fill="url(#ml-grade)" />
    }
    </g>
  </svg>

  <div class="controles" role="group" aria-label="Zoom do mapa">
    <button type="button" (click)="zoom(1.4)" aria-label="Aproximar">+</button>
    <button type="button" (click)="zoom(1 / 1.4)" aria-label="Afastar" [disabled]="!ampliado()">−</button>
    <button type="button" (click)="restaurar()" aria-label="Ver o mapa inteiro" [disabled]="!ampliado()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
    </button>
  </div>
</div>
